<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F3F2" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <title>makora</title>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen shown while the bundle loads; replaced by React -->
      <div id="initial-loader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAFAFA;">
        <h1 style="font-family: 'Crimson Pro', Georgia, serif; font-size: 2rem; font-weight: 300; color: #3C3C3B; margin-bottom: 1.5rem;">Makora</h1>
        <div style="width: 200px; height: 3px; background: #E8E8E6; border-radius: 2px; overflow: hidden;">
          <div id="load-progress" style="height: 100%; background: #3C3C3B; width: 0%; transition: width 0.3s ease-out;"></div>
        </div>
        <p style="margin-top: 0.75rem; font-size: 0.75rem; color: #9A9A98;">Loading...</p>
      </div>
    </div>
    <script>
      (function () {
        var progress = document.getElementById('load-progress');
        var start = Date.now();
        var duration = 4000;
        function update() {
          if (!document.getElementById('load-progress')) return;
          var t = Math.min(1, (Date.now() - start) / duration);
          progress.style.width = 90 * (1 - Math.pow(1 - t, 3)) + '%';
          if (t < 1) requestAnimationFrame(update);
        }
        update();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
