name: CI

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Includes tests/unit/muya-patches.test.ts, which fails on any Muya
      # version other than the one the runtime patches target. A Dependabot
      # bump going red here means: upgrade, re-run tests/perf, drop patches.
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
